---
name: validate

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: validate-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Helm charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.find.outputs.charts }}
    steps:
      - uses: actions/checkout@v6

      - name: Find kustomizations with helmCharts
        id: find
        run: |
          charts=$(grep -rl 'helmCharts:' kubernetes/ \
            | xargs -I{} dirname {} \
            | sort -u \
            | jq -R . | jq -sc .)
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

  helm-schema:
    name: Helm schema validation
    needs: discover
    runs-on: ubuntu-latest
    env:
      # kustomize's --enable-helm isolates HELM_CONFIG_HOME per build,
      # making a prior helm registry login invisible to the subprocess.
      # HELM_REGISTRY_CONFIG isn't part of that isolation, so pinning it
      # here is what makes the login reach helm.
      HELM_REGISTRY_CONFIG: /tmp/helm-registry-config.json
    strategy:
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      # Not setup-kustomize: that action resolves the release through the
      # GitHub API, which on Gitea points at Gitea and 404s.
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: "5.8.1"
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize

      # The klerigo chart is private. GITEA_TOKEN cannot read packages, so this
      # uses a PAT held as an org secret.
      - name: Log in to the package registry
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          echo "$REGISTRY_TOKEN" \
            | helm registry login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin

      # The same substitution the ArgoCD CMP does. Without it, a chart whose
      # repo URL carries a placeholder is fetched from a host that never exists.
      - name: Substitute domains
        env:
          DOMAIN_0: ${{ vars.DOMAIN_0 }}
          DOMAIN_1: ${{ vars.DOMAIN_1 }}
          DOMAIN_2: ${{ vars.DOMAIN_2 }}
          DOMAIN_3: ${{ vars.DOMAIN_3 }}
          DOMAIN_4: ${{ vars.DOMAIN_4 }}
        run: |
          args=()
          for v in DOMAIN_0 DOMAIN_1 DOMAIN_2 DOMAIN_3 DOMAIN_4; do
            eval "val=\${$v:?missing $v}"
            args+=(-e "s|\${$v}|$val|g")
          done
          find kubernetes -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 -r sed -i "${args[@]}"

      - name: Build ${{ matrix.chart }}
        env:
          CHART: ${{ matrix.chart }}
        run: kustomize build --enable-helm "$CHART"
