model:
  provider: openai-codex
  default: gpt-6.1-sol
agent:
  max_turns: 25
  run_budget_seconds: 600
terminal:
  backend: local
  cwd: /opt/data/workspace
approvals:
  mode: manual
  unattended_mode: deny
  single_query_mode: deny
  cron_mode: deny
gateway:
  unauthorized_dm_behavior: ignore
plugins:
  enabled:
    - homeassistant
    - camofox
browser:
  camofox:
    managed_persistence: true
platforms:
  homeassistant:
    enabled: false
mcp_servers:
  mealie:
    url: http://127.0.0.1:8000/mcp
  rohlik-mcp:
    url: https://mcp.rohlik.cz/mcp
    auth: oauth
platform_toolsets:
  telegram: &household_tools
    - terminal
    - file
    - homeassistant
    - mcp-rohlik-mcp
    - mcp-mealie
    - camofox
  cli: *household_tools
  api_server: *household_tools
telegram:
  require_mention: true
dashboard:
  public_url: https://samwise.${DOMAIN_0}
  trusted_proxies:
    - 10.244.0.0/16
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://auth.${DOMAIN_0}/application/o/hermes-samwise/
      client_id: hermes-dashboard-samwise
      scopes: openid profile email offline_access
