apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
  - browser-ingress.yaml
  - api-ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/instance: hermes-samwise
    includeSelectors: true
configMapGenerator:
  - name: hermes-config
    behavior: merge
    files:
      - config.yaml
      - SOUL.md
replicas:
  - name: hermes
    count: 1
patches:
  - target:
      name: hermes
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: hermes-samwise
  - target:
      name: hermes-browser
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: hermes-samwise-browser
  - target:
      name: hermes-dashboard
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: hermes-samwise-dashboard
  - target:
      name: hermes-api
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: hermes-samwise-api
  - target:
      kind: ConfigMap
      name: hermes-config
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: hermes-samwise-config
  - target:
      kind: Deployment
      name: hermes
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes
      spec:
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - name: API_SERVER_KEY
                    valueFrom:
                      secretKeyRef:
                        name: hermes-samwise-api
                        key: API_SERVER_KEY
  - path: mealie-mcp.yaml
  - target:
      kind: Deployment
      name: hermes
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: hermes-samwise-credentials
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: hermes-samwise-homeassistant
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/name
        value: hermes-samwise-homeassistant
  - target:
      kind: Deployment
      name: hermes
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes
      spec:
        template:
          spec:
            volumes:
              - name: managed-env
                projected:
                  sources:
                    - secret:
                        name: hermes-samwise-credentials
                    - secret:
                        name: hermes-samwise-homeassistant
                    - secret:
                        name: hermes-samwise-api
