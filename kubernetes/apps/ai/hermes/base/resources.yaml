apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
spec:
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 10000
      initContainers:
        - name: configure
          image: &image docker.io/nousresearch/hermes-agent:v0.22.6@sha256:d27689bc6e8581ec884a7227c9101fdaebf6c853cff8859020dac14f21452b4d
          command: [/opt/hermes/.venv/bin/python, /config/init.py]
          env: &home
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts: &mounts
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: gateway
          image: *image
          args: [gateway, run]
          envFrom:
            - secretRef:
                name: hermes-credentials
            - secretRef:
                name: hermes-homeassistant
            - prefix: _HERMES_FORCE_
              secretRef:
                name: hermes-homeassistant
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            - name: HERMES_DASHBOARD
              value: "true"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
          ports:
            - name: dashboard
              containerPort: 9119
          startupProbe:
            exec: &dashboardCheck
              command: [/opt/hermes/.venv/bin/python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:9119/api/status', timeout=2).close()"]
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: *dashboardCheck
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec: *dashboardCheck
            timeoutSeconds: 3
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts: *mounts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes
        - name: config
          configMap:
            name: hermes-config
