---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

patches:
  - path: config/pvc-bindings.yaml

helmCharts:
  - name: ollama
    repo: https://otwld.github.io/ollama-helm
    version: "1.86.0"
    releaseName: ollama
    namespace: ai
    valuesFile: ollama-values.yaml
    includeCRDs: true

  - name: open-webui
    repo: https://open-webui.github.io/helm-charts
    version: "16.6.0"
    releaseName: ai
    namespace: ai
    valuesFile: open-webui-values.yaml
    includeCRDs: true
