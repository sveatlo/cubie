---
# Standalone Ollama configuration
ollama:
  gpu:
    enabled: false # CPU-only (AMD iGPU unreliable for ROCm)
  models:
    pull:
      - llama3.2:1b # ~700MB, fast CPU inference
      - nomic-embed-text # ~275MB, embeddings for RAG
      - qwen2.5-coder:1.5b # ~1GB, code assistance

# Persistent storage for models (survives pod restarts)
persistentVolume:
  enabled: true
  size: 30Gi
  storageClass: nfs

# Extra env vars for better CPU inference
extraEnv:
  - name: OLLAMA_KEEP_ALIVE
    value: "24h"
  - name: OLLAMA_NUM_PARALLEL
    value: "1"
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "2"

service:
  type: ClusterIP
  port: 11434

ingress:
  enabled: false # Ollama is internal-only, accessed via cluster DNS
