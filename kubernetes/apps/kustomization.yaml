---
# Kustomization for the ApplicationSet root.
# The argocd self-management Application deploys this as a third source,
# making cluster-apps ApplicationSet part of argocd's desired state so it is
# never pruned (argocd Application has prune: true).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - applicationset.yaml
