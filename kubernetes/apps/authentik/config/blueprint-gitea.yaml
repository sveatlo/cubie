---
# Mounted into the authentik server and worker via blueprints.configMaps in
# values.yaml. The worker discovers every *.yaml key and applies it, so this
# provider and application are reconciled from git rather than clicked together
# in the admin UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-gitea
  namespace: authentik
data:
  gitea.yaml: |
    version: 1
    metadata:
      name: gitea
    entries:
      # Membership is not declared for either group: the blueprint field takes
      # database primary keys, which differ between installs, so members are
      # added in the UI.

      # Holding the application's only policy binding, this group decides who
      # may sign in at all.
      - model: authentik_core.group
        id: group-app-gitea
        state: present
        identifiers:
          name: app_gitea

      # Gitea reads its admin flag from the `groups` claim on every OIDC login
      # (see the oauth source in kubernetes/apps/gitea/values.yaml). The parent
      # link is what keeps admins from having to hold two memberships: a member
      # of a child group counts as a member of the parent, so the binding on
      # app_gitea already lets them through.
      - model: authentik_core.group
        id: group-app-gitea-admin
        state: present
        identifiers:
          name: app_gitea_admin
        attrs:
          parent: !KeyOf group-app-gitea

      - model: authentik_providers_oauth2.oauth2provider
        id: gitea-provider
        state: present
        identifiers:
          name: gitea
        attrs:
          name: gitea
          client_type: confidential
          # 2026.5 made grant types opt-in per provider, and a blueprint that
          # omits them creates a provider that allows none - the authorize
          # endpoint answers "Invalid grant_type for provider".
          grant_types:
            - authorization_code
            - refresh_token
          # Credentials come from the environment (see global.env), so the
          # blueprint can live in git without carrying the secret.
          client_id: !Env AUTHENTIK_GITEA_CLIENT_ID
          client_secret: !Env AUTHENTIK_GITEA_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Gitea derives this path from the source name, not the app slug:
          # /user/oauth2/<source name>/callback.
          redirect_uris:
            - url: https://git.${DOMAIN_4}/user/oauth2/authentik/callback
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        id: gitea-application
        state: present
        identifiers:
          slug: gitea
        attrs:
          name: Gitea
          # The slug is load-bearing: Gitea's discovery URL is
          # /application/o/<slug>/.well-known/openid-configuration.
          slug: gitea
          provider: !KeyOf gitea-provider
          meta_launch_url: https://git.${DOMAIN_4}/
          policy_engine_mode: any

      # An application with no bindings is open to every user, so this is the
      # entry that actually restricts Gitea.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf gitea-application
          group: !KeyOf group-app-gitea
        attrs:
          order: 0
          enabled: true
