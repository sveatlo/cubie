apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-hermes-samwise
  namespace: authentik
data:
  hermes-samwise.yaml: |
    version: 1
    metadata:
      name: hermes-samwise
    entries:
      - model: authentik_core.group
        id: hermes-samwise-access
        state: present
        identifiers:
          name: app_hermes_samwise
        attrs:
          users:
            - !Find [authentik_core.user, [username, sveatlo]]

      - model: authentik_providers_oauth2.oauth2provider
        id: hermes-samwise-provider
        state: present
        identifiers:
          name: hermes-samwise
        attrs:
          name: hermes-samwise
          client_type: public
          client_id: hermes-samwise-dashboard
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - url: https://samwise.${DOMAIN_0}/auth/callback
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

      - model: authentik_core.application
        id: hermes-samwise-application
        state: present
        identifiers:
          slug: hermes-samwise
        attrs:
          name: Samwise (Hermes)
          slug: hermes-samwise
          provider: !KeyOf hermes-samwise-provider
          meta_launch_url: https://samwise.${DOMAIN_0}/
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf hermes-samwise-application
          group: !KeyOf hermes-samwise-access
          order: 0
        attrs:
          enabled: true

      - model: authentik_providers_proxy.proxyprovider
        id: hermes-samwise-browser-provider
        state: present
        identifiers:
          name: hermes-samwise-browser
        attrs:
          mode: forward_single
          external_host: https://samwise-browser.${DOMAIN_0}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: hermes-samwise-browser-application
        state: present
        identifiers:
          slug: hermes-samwise-browser
        attrs:
          name: Samwise Browser
          provider: !KeyOf hermes-samwise-browser-provider
          meta_launch_url: https://samwise-browser.${DOMAIN_0}/vnc.html?autoconnect=true&resize=remote
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf hermes-samwise-browser-application
          group: !KeyOf hermes-samwise-access
          order: 0
        attrs:
          enabled: true

      - model: authentik_outposts.outpost
        state: present
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          type: proxy
          providers:
            - !KeyOf hermes-samwise-browser-provider

      - model: authentik_core.application
        state: absent
        identifiers:
          slug: hermes

      - model: authentik_providers_oauth2.oauth2provider
        state: absent
        identifiers:
          name: hermes
