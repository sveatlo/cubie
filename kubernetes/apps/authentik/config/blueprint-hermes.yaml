apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-hermes
  namespace: authentik
data:
  hermes.yaml: |
    version: 1
    metadata:
      name: hermes
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: hermes-provider
        state: present
        identifiers:
          name: hermes
        attrs:
          name: hermes
          client_type: public
          client_id: hermes-dashboard
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - url: https://hermes.${DOMAIN_0}/auth/callback
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

      - model: authentik_core.application
        id: hermes-application
        state: present
        identifiers:
          slug: hermes
        attrs:
          name: Hermes
          slug: hermes
          provider: !KeyOf hermes-provider
          meta_launch_url: https://hermes.${DOMAIN_0}/
          policy_engine_mode: all

      # Without a binding, Authentik admits every authenticated user.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf hermes-application
          user: !Find [authentik_core.user, [username, sveatlo]]
          order: 0
        attrs:
          enabled: true
