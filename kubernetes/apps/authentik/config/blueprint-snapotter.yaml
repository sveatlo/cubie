apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-snapotter
  namespace: authentik
data:
  snapotter.yaml: |
    version: 1
    metadata:
      name: snapotter
    entries:
      - model: authentik_core.group
        id: group-app-snapotter
        state: present
        identifiers:
          name: app_snapotter

      - model: authentik_providers_oauth2.oauth2provider
        id: snapotter-provider
        state: present
        identifiers:
          name: snapotter
        attrs:
          name: snapotter
          client_type: confidential
          client_id: snapotter
          client_secret: !Env AUTHENTIK_SNAPOTTER_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - url: https://tools.${DOMAIN_0}/api/auth/oidc/callback
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        id: snapotter-application
        state: present
        identifiers:
          slug: snapotter
        attrs:
          name: SnapOtter
          slug: snapotter
          provider: !KeyOf snapotter-provider
          meta_launch_url: https://tools.${DOMAIN_0}/
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf snapotter-application
          group: !KeyOf group-app-snapotter
          order: 0
        attrs:
          enabled: true
