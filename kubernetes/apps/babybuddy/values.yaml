---
controllers:
  babybuddy:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/babybuddy
          tag: "2.10.0"
          pullPolicy: IfNotPresent
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: babybuddy
          DB_USER: babybuddy
          DB_HOST: babybuddy-db-rw
          DB_PORT: "5432"
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: babybuddy-db-app
                key: password
          ALLOWED_HOSTS: baby.${DOMAIN_0}
          CSRF_TRUSTED_ORIGINS: https://baby.${DOMAIN_0}
          SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: babybuddy-secret
                key: secret-key
        # TCP probes on the nginx port (8000). HTTP probes can't be used here:
        # kubelet sends the pod IP as the Host header, which Django rejects with
        # 400 DisallowedHost (ALLOWED_HOSTS=baby.${DOMAIN_0}). A failed s6 init
        # leaves nothing listening on 8000, so TCP is enough to detect it.
        probes:
          liveness:
            enabled: true
            type: TCP
          readiness:
            enabled: true
            type: TCP
          startup:
            enabled: true
            type: TCP
            spec:
              # ~150s to cover first-boot migrations before liveness kicks in
              failureThreshold: 30
              periodSeconds: 5

service:
  babybuddy:
    controller: babybuddy
    ports:
      http:
        port: 8000

ingress:
  babybuddy:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: traefik-lan-only@kubernetescrd
    hosts:
      - host: baby.${DOMAIN_0}
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: babybuddy
              port: http

persistence:
  data:
    enabled: true
    storageClass: nfs
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      babybuddy:
        app:
          - path: /config
