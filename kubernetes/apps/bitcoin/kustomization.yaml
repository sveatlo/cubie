---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bitcoin

# NOTE: the *-secret.yaml.sops files in config/ are NOT listed here.
# Per repo convention, SOPS secrets are decrypted and applied manually:
#   bitcoind-config, lnd-config, thunderhub-config
# See config/README.md for the one-time setup.
resources:
  - config/bitcoind.yaml
  - config/lnd.yaml
  - config/thunderhub.yaml
  - config/ingressroute.yaml
