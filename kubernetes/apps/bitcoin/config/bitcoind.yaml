---
# Bitcoin Core — pruned mainnet full node.
# Pruned to ~10GB so chain data fits comfortably on NFS.
# Exposes JSON-RPC (8332), ZMQ block/tx (28332/28333) and P2P (8333).
# bitcoin.conf (with rpcauth) is supplied by the `bitcoind-config` SOPS secret.
apiVersion: v1
kind: Service
metadata:
  name: bitcoind
  labels:
    app.kubernetes.io/name: bitcoind
spec:
  selector:
    app.kubernetes.io/name: bitcoind
  ports:
    - name: rpc
      port: 8332
      targetPort: rpc
    - name: zmq-block
      port: 28332
      targetPort: zmq-block
    - name: zmq-tx
      port: 28333
      targetPort: zmq-tx
    - name: p2p
      port: 8333
      targetPort: p2p
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bitcoind
  labels:
    app.kubernetes.io/name: bitcoind
spec:
  serviceName: bitcoind
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bitcoind
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitcoind
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bitcoind
          image: lncm/bitcoind:v28.0
          args:
            - "-datadir=/data/.bitcoin"
            - "-printtoconsole"
          ports:
            - name: rpc
              containerPort: 8332
            - name: zmq-block
              containerPort: 28332
            - name: zmq-tx
              containerPort: 28333
            - name: p2p
              containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data/.bitcoin
            - name: config
              mountPath: /data/.bitcoin/bitcoin.conf
              subPath: bitcoin.conf
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: p2p
            initialDelaySeconds: 60
            periodSeconds: 60
      volumes:
        - name: config
          secret:
            secretName: bitcoind-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs
        resources:
          requests:
            storage: 50Gi
