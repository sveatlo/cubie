apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: klerigo
helmCharts:
  # Application workloads. Chart and images are published together by klerigo's
  # CI, which also writes the version below.
  - name: klerigo
    repo: oci://git.${DOMAIN_4}/klerigo
    version: "0.1.0-6f48d32"
    releaseName: klerigo
    namespace: klerigo
    valuesFile: values.yaml
  # Stateful dependencies. Same release name so the generated service names are
  # the ones the application chart is configured to reach.
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    version: "5.0.1"
    releaseName: klerigo
    namespace: klerigo
    valuesFile: deps-values.yaml
resources:
  - config/cnpg-cluster.yaml
  - config/kafka-topics-job.yaml
  - config/garage-init-job.yaml
