---
# The apex and www are the marketing site, so the app lives one label down.
# The chart derives both Ingress hosts and the tenant base from this.
domain: app.${DOMAIN_2}

# Images are private, and the kubelet authenticates separately from the chart pull.
imagePullSecrets:
  - name: ghcr-pull

storage:
  # Presigned URLs are signed for the host the browser uses, so this must be
  # the public name, not the in-cluster service.
  publicEndpoint: https://media.${DOMAIN_2}
  internalEndpoint: http://klerigo-garage:3900

ingress:
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  # Empty overrides the chart default of lan-only.
  middlewares: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 512Mi

# TEMPORARY. Deliberate breakage for klerigo-app/main#467, which asks for a
# request to be diagnosed end to end in Grafana without kubectl. Revert as soon
# as that walk is done.
#
# No such Service exists, so every gateway route that proxies vocabulary fails
# to connect.
services:
  gateway:
    env:
      VOCABULARY_GRPC_URL: http://klerigo-vocabulary-gone:50055
