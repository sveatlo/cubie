---
# Auto-create is off, and notifications subscribes at startup: a missing topic
# is a fatal UnknownTopicOrPartition, not a retry. One line per consumed domain.
#
# Must run PreSync, not PostSync. notifications' own health depends on these
# topics existing, and ArgoCD won't run PostSync hooks until the app is
# healthy, so PostSync here deadlocks: the hook that unblocks notifications
# never fires because notifications isn't healthy yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: klerigo-kafka-topics
  namespace: klerigo
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topics
          image: apache/kafka:3.9.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for topic in identity courses calls; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server klerigo-kafka:9092 \
                  --create --if-not-exists --partitions 1 --replication-factor 1 \
                  --topic "klerigo.events.$topic.v1"
              done
