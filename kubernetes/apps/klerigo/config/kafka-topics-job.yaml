---
# Auto-create is off, and notifications subscribes at startup: a missing topic
# is a fatal UnknownTopicOrPartition, not a retry. One line per consumed domain.
#
# A sync-wave, not a hook: notifications' own health depends on these topics
# existing, and the kafka broker needs to be up before this job can reach it.
# Neither PreSync nor PostSync can satisfy both orderings at once (PreSync
# would run before the broker in wave -2 even exists; PostSync only runs
# after the whole app, including notifications, is already healthy). Wave -1
# sits between the broker (-2) and everything else (the default, 0).
apiVersion: batch/v1
kind: Job
metadata:
  name: klerigo-kafka-topics
  namespace: klerigo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topics
          image: apache/kafka:3.9.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for topic in identity courses calls scheduler; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server klerigo-kafka:9092 \
                  --create --if-not-exists --partitions 1 --replication-factor 1 \
                  --topic "klerigo.events.$topic.v1"
              done
