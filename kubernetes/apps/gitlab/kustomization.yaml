---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitlab

helmCharts:
  - name: gitlab
    repo: https://charts.gitlab.io
    version: "10.2.1"
    releaseName: gitlab
    namespace: gitlab
    valuesFile: values.yaml

resources:
  - config/cnpg-cluster.yaml
  - config/valkey.yaml
  - config/garage.yaml
  - config/garage-init-job.yaml

patches:
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: unused
