---
controllers:
  espanolenka:
    containers:
      app:
        image:
          repository: ghcr.io/sveatlo/espanolenka-website
          # Bootstrapped on "latest" until the first date-tagged bump PR lands
          # (kept up to date by .github/workflows/publish.yaml in the website repo).
          tag: latest
          pullPolicy: IfNotPresent
        env:
          CONTACT_TO_EMAIL: hello@${DOMAIN_3}
          CONTACT_FROM_EMAIL: no-reply@${DOMAIN_3}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: REPLACE_ME
          RESEND_API_KEY:
            valueFrom:
              secretKeyRef:
                name: espanolenka-secret
                key: resend-api-key
          TURNSTILE_SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: espanolenka-secret
                key: turnstile-secret-key
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
          readiness:
            enabled: true
            type: HTTP
            path: /

service:
  espanolenka:
    controller: espanolenka
    ports:
      http:
        port: 3000

ingress:
  espanolenka:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      # Deliberately no traefik-lan-only middleware: this is a public marketing site,
      # unlike every other app in this repo.
    hosts:
      - host: ${DOMAIN_3}
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: espanolenka
              port: http
