---
# git-over-SSH. Traefik terminates nothing here: the git-ssh entrypoint is a
# plain TCP port (2222 in-container, published as 22) forwarded straight to
# Gitea's sshd, so HostSNI has nothing to match on and must be the catch-all.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitea-ssh
  namespace: gitea
spec:
  entryPoints:
    - git-ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gitea-ssh
          port: 22
