---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-db
  namespace: gitea
spec:
  instances: 1

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"

  storage:
    size: 10Gi
    storageClass: nfs

  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      encoding: UTF8
      localeCType: C
      localeCollate: C
