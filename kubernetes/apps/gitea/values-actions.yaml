---
enabled: true

# In-cluster URL. Going out through git.${DOMAIN_4} would send every runner
# poll through Traefik's lan-only middleware, which the pod network is not.
giteaRootURL: http://gitea-http.gitea.svc.cluster.local:3000

existingSecret: gitea-runner-token
existingSecretKey: token

global:
  storageClass: nfs

statefulset:
  annotations:
    # The runners poll Gitea on startup and crash-loop until it answers. Gitea
    # itself renders without a wave annotation, which ArgoCD reads as wave 0,
    # so this holds the runners back until it is up.
    argocd.argoproj.io/sync-wave: "1"

  # One, not one per labelled node. Every node here is also a control-plane
  # node, and two concurrent Rust builds pushed etcd into flapping health
  # checks, which stalled CNPG reconciles and made the Gitea API intermittent.
  # CI waits rather than the cluster wobbling.
  replicas: 1
  timezone: Europe/Bratislava

  nodeSelector:
    workload.gitea-runner: "true"

  # Rootless Docker builds inside a user namespace, which the runtime default
  # profile blocks. talos/patches/all/seccomp-profiles.yaml ships this one.
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/ci-buildkit.json

  persistence:
    size: 30Gi

  runner:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # The chart gives the runner the socket at /var/run/docker.sock, but the
    # rootless daemon knows it as /run/user/1000/docker.sock. act_runner passes
    # its own path to the daemon when bind-mounting the socket into job
    # containers, so the two have to agree or every job that shells out to
    # docker gets an empty directory where the socket should be.
    extraVolumeMounts:
      - name: docker-socket
        mountPath: /run/user/1000
    config: |
      log:
        level: info
      cache:
        enabled: true
      container:
        require_docker: true
        docker_timeout: 300s
        docker_host: unix:///run/user/1000/docker.sock
      runner:
        capacity: 1
        timeout: 1h
        labels:
          - ubuntu-latest:docker://catthehacker/ubuntu:act-22.04
          - ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04
          - ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04

  dind:
    rootless: true
    uid: 1000
    tag: 29.5.2-dind-rootless
    # The GitLab runner asked for 4 CPU / 7Gi on these builds, but it was not
    # sharing a node with etcd. Three of six cores leaves the control plane
    # enough to answer its own health checks; the image build caps rustc
    # parallelism to stay inside the memory limit.
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "3"
        memory: 8Gi
