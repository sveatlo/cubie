---
enabled: true

# In-cluster URL. Going out through git.${DOMAIN_4} would send every runner
# poll through Traefik's lan-only middleware, which the pod network is not.
giteaRootURL: http://gitea-http.gitea.svc.cluster.local:3000

existingSecret: gitea-runner-token
existingSecretKey: token

global:
  storageClass: nfs

statefulset:
  annotations:
    # Runners crash-loop until Gitea answers their registration, and Gitea
    # renders at the default wave 0.
    argocd.argoproj.io/sync-wave: "1"

  # Two concurrent Rust builds on these control-plane nodes made etcd flap.
  replicas: 1
  timezone: Europe/Bratislava

  nodeSelector:
    workload.gitea-runner: "true"

  # Rootless Docker builds inside a user namespace, which the runtime default
  # profile blocks. talos/patches/all/seccomp-profiles.yaml ships this one.
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/ci-buildkit.json

  persistence:
    size: 30Gi

  runner:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        # act_runner buffers a job's whole log before shipping it, and a Rust
        # build's output ran the 512Mi ceiling into an OOM kill mid-job.
        memory: 1Gi
    # act_runner hands the daemon its own socket path when mounting it into job
    # containers, so it has to match the one the rootless daemon listens on.
    extraVolumeMounts:
      - name: docker-socket
        mountPath: /run/user/1000
    config: |
      log:
        level: info
      cache:
        enabled: true
      container:
        require_docker: true
        docker_timeout: 300s
        docker_host: unix:///run/user/1000/docker.sock
      runner:
        capacity: 2
        timeout: 1h
        labels:
          - ubuntu-latest:docker://catthehacker/ubuntu:act-22.04
          - ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04
          - ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04

  dind:
    rootless: true
    uid: 1000
    tag: 29.5.2-dind-rootless
    # Three of six cores leaves etcd enough to answer its health checks.
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "3"
        memory: 8Gi
