apiVersion: v1
kind: Namespace
metadata:
  name: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    # The actions chart's Docker-in-Docker sidecar runs privileged even in
    # rootless mode, which Talos' baseline default rejects. It applies to the
    # whole namespace, Gitea and its database included, because the runners
    # live here too.
    pod-security.kubernetes.io/enforce: privileged
