apiVersion: v1
kind: Namespace
metadata:
  name: gitea-actions
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    # The chart's Docker-in-Docker sidecar runs privileged even in rootless
    # mode, which Talos' baseline default rejects.
    pod-security.kubernetes.io/enforce: privileged
