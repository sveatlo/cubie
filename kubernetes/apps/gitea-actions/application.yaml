---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-actions
  namespace: argocd
  annotations:
    # After gitea itself: the runners poll it on startup and crash-loop until
    # it answers.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/mirkwood/cubie.git
    targetRevision: HEAD
    path: kubernetes/apps/gitea-actions
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea-actions
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
