---
replicas: 1

tempo:
  reportingEnabled: false
  # 7d, the map's starting position. Traces are the volume this map is least
  # able to predict — it instruments down to the repository layer at 100%
  # sampling — so this is the first number to revisit under real load.
  retention: 168h
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  # The chart's default also opens Jaeger on four ports and OpenCensus on one.
  # They cannot be removed: templates/_ports.tpl dereferences
  # `.Values.tempo.receivers.jaeger.protocols.thrift_compact` unconditionally
  # and nulling the key fails the render. Left at the chart default.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  # Span metrics and service graphs are computed from the same spans Tempo
  # already holds, and remote-written into the existing Prometheus. This is what
  # makes Grafana's service-graph and RED-metrics panels work without the
  # application emitting anything extra.
  #
  # storage/traces_storage below point at extraVolumes.metrics-generator-local
  # (emptyDir), not the NFS-backed `storage` PVC: the local-blocks flush queue
  # does unlink-then-reopen on completed blocks, which isn't atomic on NFS and
  # races queriers into "no such file or directory" (grafana/tempo#5224).
  # Losing this emptyDir on pod reschedule just drops the recent-metrics
  # cache; span-metrics/service-graphs are unaffected since those are
  # remote-written to Prometheus separately.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    # local-blocks powers Grafana Traces Drilldown's TraceQL metrics; writes
    # queryable blocks to traces_storage below instead of just holding them
    # in memory for the "recent" query path.
    processor:
      local_blocks:
        flush_to_storage: true
    storage:
      path: /var/tempo-local/metrics-generator/wal
    traces_storage:
      path: /var/tempo-local/metrics-generator/traces
  extraVolumeMounts:
    - name: metrics-generator-local
      mountPath: /var/tempo-local
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

extraVolumes:
  - name: metrics-generator-local
    emptyDir: {}

persistence:
  enabled: true
  storageClassName: nfs
  accessModes:
    - ReadWriteOnce
  # Advisory: nfs.csi enforces no quota, so `tempo.retention` above is what
  # actually bounds the footprint.
  size: 100Gi

serviceMonitor:
  enabled: true
