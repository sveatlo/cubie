---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert-domain-3
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: wildcard-tls-domain-3
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "${DOMAIN_3}"
    - "*.${DOMAIN_3}"
  duration: 2160h # 90 days
  renewBefore: 360h # renew 15 days before expiry
