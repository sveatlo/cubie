apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traefik
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  groups:
    - name: traefik
      rules:
        - alert: TraefikServiceDown
          expr: traefik_service_server_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Traefik service {{ $labels.exported_service }} has no healthy backends"

        - alert: TraefikHighErrorRate
          expr: |
            sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) by (exported_service)
            /
            sum(rate(traefik_service_requests_total[5m])) by (exported_service)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik service {{ $labels.exported_service }} high 5xx error rate"
            description: "{{ $value | humanizePercentage }} of requests are returning 5xx"

        - alert: TraefikHighClientErrorRate
          expr: |
            sum(rate(traefik_service_requests_total{code=~"4.."}[5m])) by (exported_service)
            /
            sum(rate(traefik_service_requests_total[5m])) by (exported_service)
            > 0.10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik service {{ $labels.exported_service }} high 4xx error rate"
            description: "{{ $value | humanizePercentage }} of requests are returning 4xx"

        - alert: TraefikHighLatency
          expr: |
            (
              histogram_quantile(0.99,
                sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le, exported_service)
              ) > 2
            )
            and on (exported_service)
            (
              sum by (exported_service) (
                increase(traefik_service_request_duration_seconds_count[5m])
              ) >= 10
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik service {{ $labels.exported_service }} p99 latency is high"
            description: "p99 latency is {{ $value | humanizeDuration }}"

        - alert: TraefikTLSCertExpiringSoon
          expr: (traefik_tls_certs_not_after - time()) / 86400 < 7
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS certificate expiring in less than 7 days"
            description: "Certificate {{ $labels.sans }} expires in {{ $value | humanize }} days"

        - alert: TraefikHighTraffic
          expr: sum(rate(traefik_entrypoint_requests_total[5m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik is receiving unusually high traffic"
            description: "Request rate is {{ $value | humanize }} req/s across all entrypoints"
