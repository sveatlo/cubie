---
# Traefik TLSStore — registers one certificate per domain; Traefik selects the
# matching one by SNI. defaultCertificate is only used when nothing matches.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  defaultCertificate:
    secretName: wildcard-tls-domain-0
  certificates:
    - secretName: wildcard-tls-domain-0
    - secretName: wildcard-tls-domain-1
    - secretName: wildcard-tls-domain-2
    - secretName: wildcard-tls-domain-3
    - secretName: wildcard-tls-domain-4
