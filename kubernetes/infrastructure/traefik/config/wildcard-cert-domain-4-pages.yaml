---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert-domain-4-pages
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: wildcard-tls-domain-4-pages
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "pages.${DOMAIN_4}"
    - "*.pages.${DOMAIN_4}"
  duration: 2160h
  renewBefore: 360h
