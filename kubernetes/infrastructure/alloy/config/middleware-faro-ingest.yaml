---
# The Faro ingest endpoint is the only public, unauthenticated write path in the
# cluster, and it shares Traefik with immich, nextcloud and authentik. These
# limits exist to keep a runaway browser loop — or someone curling it — from
# being everything else's problem too. faro.receiver does its own per-app rate
# limiting behind this; that one protects Loki and Tempo, this one protects the
# ingress.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: faro-ingest
  namespace: monitoring
spec:
  chain:
    middlewares:
      - name: faro-ingest-rate-limit
        namespace: monitoring
      - name: faro-ingest-in-flight
        namespace: monitoring
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: faro-ingest-rate-limit
  namespace: monitoring
spec:
  rateLimit:
    # Per source IP, averaged over a minute. Traefik's Service runs
    # externalTrafficPolicy: Local, so the client IP survives MetalLB and this
    # is genuinely per-client rather than per-node.
    #
    # An active browser session posts on the order of tens of requests a minute.
    # The headroom here is for NAT: a household or a school sharing one address
    # is one bucket, so the limit has to hold several sessions at once.
    average: 300
    period: 1m
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: faro-ingest-in-flight
  namespace: monitoring
spec:
  inFlightReq:
    amount: 20
