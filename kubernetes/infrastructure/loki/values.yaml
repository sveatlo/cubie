---
# Monolithic Loki on filesystem storage. The chart defaults to a mode over
# object storage, which for this cluster's log volume would be several
# Deployments and a memcached tier to run one process' worth of work.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false
  commonConfig:
    # One replica, so anything above 1 would block every write on a quorum that
    # can never form.
    replication_factor: 1
  storage:
    type: filesystem
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    # OTLP log records from six services batch larger than the 4MB default.
    grpc_server_max_recv_msg_size: 16777216
    grpc_server_max_send_msg_size: 16777216
  # A real install requires an explicit schema; the chart ships none and its
  # `useTestSchema` escape hatch is not meant for anything durable. `from` is the
  # date this schema starts applying, so it must not be moved once data exists
  # under it.
  schemaConfig:
    configs:
      - from: "2026-08-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # 14d, the map's starting position. This is the setting that actually bounds
    # disk use — the PVC below is advisory, since nfs.csi enforces no quota.
    retention_period: 336h
    # OTLP carries trace_id and span_id as structured metadata; without this
    # every log-to-trace jump in Grafana breaks.
    allow_structured_metadata: true
    volume_enabled: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_query_series: 100000
  # Retention is only enforced if the compactor is told to enforce it; the
  # `retention_period` above is inert on its own.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    storageClass: nfs
    size: 100Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

# SimpleScalable components. Explicitly zeroed rather than left to
# `deploymentMode` — the chart still renders them from these replica counts.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# The nginx gateway only earns its keep when reads and writes are separate
# Deployments. With one process there is nothing to route between, so clients
# talk to the `loki` service directly.
gateway:
  enabled: false

# Both default on and both are memcached: 8GiB requested for chunks, 1GiB for
# results. That is more memory than the rest of this stack combined.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Synthetic log stream and its helm test. Useful for validating a distributed
# install; here it is a DaemonSet writing logs about itself.
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
