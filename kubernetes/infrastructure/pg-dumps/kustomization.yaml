apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level namespace: the exec RoleBindings live in the app namespaces and must not be rewritten.

resources:
  - config/namespace.yaml
  - config/rbac.yaml
  - config/cronjob.yaml

configMapGenerator:
  - name: pg-dumps-script
    namespace: pg-dumps
    files:
      - dump.sh
