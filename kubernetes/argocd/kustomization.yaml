---
# ArgoCD self-management. Rendered through the kustomize-envsubst CMP (see the
# Application in application.yaml) so the domain in values.yaml (argocd.${DOMAIN_0})
# is substituted at render time and never committed in plaintext.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "9.4.17"
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true
