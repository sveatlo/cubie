---
# ArgoCD self-management Application.
# Apply once after bootstrap to hand ArgoCD control of itself:
#   kubectl apply -f kubernetes/argocd/application.yaml
#
# Rendered through the kustomize-envsubst CMP (kustomization.yaml + values.yaml in
# this dir) so the domain in values.yaml is substituted at render time. After this,
# changes to kubernetes/argocd/values.yaml are auto-applied by ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # sync-wave "-1" — ArgoCD must be healthy before infrastructure apps sync
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sveatlo/cubie.git
    targetRevision: HEAD
    path: kubernetes/argocd
    # Render via the kustomize-envsubst CMP (kustomize build --enable-helm, then
    # substitute ${DOMAIN_0}/${DOMAIN_1} from vars/domains.yaml.sops).
    plugin:
      name: kustomize-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
