---
# ArgoCD Helm values for initial bootstrap install.
# This is a minimal single-replica setup suitable for a homelab.
# After bootstrap, ArgoCD manages itself via kubernetes/argocd/values.yaml.

global:
  domain: argocd.${DOMAIN_0}

configs:
  params:
    # TLS terminated at Traefik; ArgoCD listens on plain HTTP internally
    server.insecure: "true"

  cm:
    url: https://argocd.${DOMAIN_0}
    # Allow kustomize to use helm charts
    kustomize.buildOptions: "--enable-helm"
    # Resource tracking method - annotation is more reliable than label
    application.resourceTrackingMethod: annotation

  rbac:
    policy.default: role:readonly

  repositories:
    cubie:
      url: https://github.com/sveatlo/cubie.git
      name: cubie
      type: git

server:
  replicas: 1
  # Expose via Traefik Ingress (created after ArgoCD is healthy)
  ingress:
    enabled: false # Enable after Traefik is synced by ArgoCD

repoServer:
  env:
    - name: HELM_PLUGINS
      value: /gitops-tools/helm-plugins/
    - name: HELM_SECRETS_CURL_PATH
      value: /gitops-tools/curl
    - name: HELM_SECRETS_SOPS_PATH
      value: /gitops-tools/sops
    - name: HELM_SECRETS_VALS_PATH
      value: /gitops-tools/vals
    - name: HELM_SECRETS_AGE_PATH
      value: /gitops-tools/age
    - name: HELM_SECRETS_KUBECTL_PATH
      value: /gitops-tools/kubectl
    - name: HELM_SECRETS_BACKEND
      value: sops
    # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
    - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
      value: "false"
    - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
      value: "true"
    - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
      value: "false"
    - name: HELM_SECRETS_WRAPPER_ENABLED
      value: "true"
    - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
      value: "true"
    - name: HELM_SECRETS_HELM_PATH
      value: /usr/local/bin/helm

    - name: SOPS_AGE_KEY_FILE
      value: /helm-secrets-private-keys/key.txt
  volumes:
    - name: gitops-tools
      emptyDir: {}
    # kubectl create secret generic helm-secrets-private-keys --from-file=key.asc=assets/gpg/private2.gpg
    - name: helm-secrets-private-keys
      secret:
        secretName: helm-secrets-private-keys
    # CMP sidecar scratch + plugin config (see extraContainers / extraObjects below)
    - name: cmp-tmp
      emptyDir: {}
    - name: cmp-plugin
      configMap:
        name: cmp-kustomize-envsubst
  # kustomize-envsubst CMP: builds with helm, then substitutes ${DOMAIN_0}/${DOMAIN_1}
  # from the SOPS-encrypted vars/domains.yaml.sops using the mounted age key.
  extraContainers:
    - name: cmp-kustomize-envsubst
      image: quay.io/argoproj/argocd:v3.4.5 # keep in sync with chart appVersion (9.4.17 -> v3.3.6)
      imagePullPolicy: IfNotPresent
      command: ["/var/run/argocd/argocd-cmp-server"]
      env:
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        - name: HELM_CACHE_HOME
          value: /tmp/helm/cache
        - name: HELM_CONFIG_HOME
          value: /tmp/helm/config
        - name: HELM_DATA_HOME
          value: /tmp/helm/data
        - name: SOPS_AGE_KEY_FILE
          value: /helm-secrets-private-keys/key.txt
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-plugin
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
        - name: cmp-tmp
          mountPath: /tmp
        - name: gitops-tools
          mountPath: /gitops-tools
        - name: helm-secrets-private-keys
          mountPath: /helm-secrets-private-keys/
  volumeMounts:
    - mountPath: /gitops-tools
      name: gitops-tools
    - mountPath: /usr/local/sbin/helm
      subPath: helm
      name: gitops-tools
    - mountPath: /helm-secrets-private-keys/
      name: helm-secrets-private-keys
  initContainers:
    - name: download-tools
      image: alpine:latest
      imagePullPolicy: IfNotPresent
      command: [sh, -euc]
      env:
        - name: HELM_SECRETS_VERSION
          value: "4.7.5"
        - name: KUBECTL_VERSION
          value: "1.35.3"
        - name: VALS_VERSION
          value: "0.43.7"
        - name: SOPS_VERSION
          value: "3.12.2"
        - name: AGE_VERSION
          value: "1.3.1"
        - name: HELM_PLUGINS
          value: /gitops-tools/helm-plugins/
        - name: HELM_SECRETS_CURL_PATH
          value: /gitops-tools/curl
        - name: HELM_SECRETS_SOPS_PATH
          value: /gitops-tools/sops
        - name: HELM_SECRETS_VALS_PATH
          value: /gitops-tools/vals
        - name: HELM_SECRETS_AGE_PATH
          value: /gitops-tools/age
        - name: HELM_SECRETS_KUBECTL_PATH
          value: /gitops-tools/kubectl
      args:
        - |
          mkdir -p "${HELM_PLUGINS}"

          export CURL_ARCH=$(uname -m | sed -e 's/x86_64/amd64/')
          wget -qO "${HELM_SECRETS_CURL_PATH}" https://github.com/moparisthebest/static-curl/releases/latest/download/curl-${CURL_ARCH}

          export GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')
          wget -qO "${HELM_SECRETS_KUBECTL_PATH}" https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${GO_ARCH}/kubectl
          wget -qO "${HELM_SECRETS_SOPS_PATH}" https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${GO_ARCH}
          wget -qO- https://github.com/helmfile/vals/releases/download/v${VALS_VERSION}/vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz | tar zxv -C "${HELM_SECRETS_VALS_PATH%/*}" vals
          wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz | tar -C "${HELM_PLUGINS}" -xzf-
          wget -qO- "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" | tar -xzf- --strip-components=1 -C "${HELM_SECRETS_AGE_PATH%/*}" age/age

          chmod +x \
            "${HELM_SECRETS_CURL_PATH}" \
            "${HELM_SECRETS_SOPS_PATH}" \
            "${HELM_SECRETS_KUBECTL_PATH}" \
            "${HELM_SECRETS_VALS_PATH}" \
            "${HELM_SECRETS_AGE_PATH}"

          cp "${HELM_PLUGINS}/helm-secrets/scripts/wrapper/helm.sh" /gitops-tools/helm
      volumeMounts:
        - mountPath: /gitops-tools
          name: gitops-tools

applicationSet:
  replicas: 1

notifications:
  enabled: false

dex:
  enabled: false

redis:
  enabled: true

redis-ha:
  enabled: false

# ConfigManagementPlugin consumed by the cmp-kustomize-envsubst sidecar.
# generate: kustomize build --enable-helm, then sed-substitute the domain
# placeholders decrypted from vars/domains.yaml.sops. Keep the sed allowlist in
# sync with hack/render.sh.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cmp-kustomize-envsubst
      namespace: argocd
    data:
      plugin.yaml: |
        apiVersion: argoproj.io/v1alpha1
        kind: ConfigManagementPlugin
        metadata:
          name: kustomize-envsubst
        spec:
          # No discover block: the plugin is only ever selected by explicit
          # `source.plugin.name`. Auto-discovery would wrongly claim values-ref
          # sources (e.g. a multi-source app's values path) that have no root
          # kustomization.yaml and fail.
          generate:
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                root="$PWD"
                while [ "$root" != "/" ] && [ ! -f "$root/vars/domains.yaml.sops" ]; do
                  root="$(dirname "$root")"
                done
                set -a
                eval "$(/gitops-tools/sops -d "$root/vars/domains.yaml.sops" \
                  | sed -n -E 's/^([A-Za-z_][A-Za-z0-9_]*):[[:space:]]*(.*)$/\1=\2/p')"
                set +a
                # Build sed args from var NAMES so the literal ${DOMAIN_x} placeholder
                # strings never appear in this script. That keeps it self-substitution
                # safe when ArgoCD renders its own values (which embed this plugin)
                # through this very CMP.
                args=()
                for v in DOMAIN_0 DOMAIN_1; do
                  eval "val=\${$v:?missing $v}"
                  args+=(-e "s|\${$v}|$val|g")
                done
                # Substitute in the SOURCE files before building, so domain values
                # that helm base64-encodes into Secrets are also substituted (a
                # post-render sed cannot reach inside base64). Scoped to this
                # component's checkout; only our ${DOMAIN_x} placeholders ever match.
                find . -type f \( -name '*.yaml' -o -name '*.yml' \) -not -path './charts/*' -print0 \
                  | xargs -0 -r sed -i "${args[@]}"
                kustomize build --enable-helm .
